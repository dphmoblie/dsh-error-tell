name: CI

on:
  # P2-19：此前只有 workflow_dispatch，push/PR 完全不跑测试，发布质量全靠人工点击
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 仍可手动触发（例如只想跑 full 全链路）

# 同一分支/PR 新提交自动取消旧 run，避免排队重复安装 dsh（npm i -g 需拉几十个 @deepseek-ai 包）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 单元测试 + 分段 e2e（C/D/EFG/S3/H）
    runs-on: windows-latest
    # 40 分钟：dsh 0.1.7-rc.2 起「插件 import 失败不再终止进程」，
    # Phase D 的每个失败窗口/quit 窗口都要跑满（本机实测整套 D ≈ 4.4 min），
    # 后面还有 EFG/S3C/H 从未在 CI 跑过，留足余量避免误判为超时失败。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 不要把 dsh 钉回 0.1.0-rc.6：上游在 2026-09-22 锁步发布了 cordis 4.0.4 /
      # cordis-plugin-hmr 1.0.19 等，旧 dsh 动态装载 HMR 服务失败后会抛
      # "user patch-layer watching requires the Cordis HMR service" 并 exit 1，
      # 任何 profile 都起不来（npm i -g 没有 lockfile，钉不住 ^1.0.16 这类传递依赖）。
      - name: 安装 dsh CLI（e2e 依赖）
        run: npm i -g @deepseek-ai/dsh@0.1.7-rc.2
      - name: 记录 dsh 与 cordis 依赖版本（上游漂移诊断）
        shell: pwsh
        run: |
          dsh --version
          $dshRoot = Join-Path (npm root -g).Trim() '@deepseek-ai\dsh'
          node -e "const r=require.resolve;const dshRoot=process.argv[1];for(const p of process.argv.slice(2)){try{console.log(p+' = '+require(r(p+'/package.json',{paths:[dshRoot]})).version)}catch(e){console.log(p+' = (未解析到)')}}" $dshRoot '@deepseek-ai/dsh-app-boot' '@deepseek-ai/cordis' '@deepseek-ai/cordis-plugin-hmr' '@deepseek-ai/cordis-plugin-loader' '@deepseek-ai/cordis-plugin-timer'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        run: pnpm test
      - name: e2e Phase C（client-tell 注入/禁用端点/组合图排除）
        run: pnpm e2e:c
      - name: e2e Phase D（import 预检拦截）
        run: pnpm e2e:d
      - name: e2e Phase E+F+G（幂等性/YAML 损坏/多坏插件）
        run: pnpm e2e:efg
      - name: e2e S3（端点 maxDisable 熔断）
        run: pnpm e2e:s3c
      - name: e2e Phase H（apply 挂起 → 进程级超时 → 熔断）
        run: pnpm e2e:h


  unit-linux:
    name: 单元测试（ubuntu，跨平台）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        run: pnpm test
  full:
    name: 全链路 e2e（A-H，手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60   # 全链路含 Phase A-H，其中 D 在 0.1.7-rc.2 上单独就要 ~5 min
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装 dsh CLI（e2e 依赖）
        run: npm i -g @deepseek-ai/dsh@0.1.7-rc.2   # 与实机一致；上游漂移原因见 fast 作业里的注释
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 全链路 e2e
        run: node test/e2e/run-e2e.mjs
