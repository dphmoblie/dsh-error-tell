name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 新提交自动取消旧 run，避免排队重复安装 dsh（npm i -g 需拉几十个 @deepseek-ai 包）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 单元测试 + 分段 e2e（C/D/EFG/S3）
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装 dsh CLI（e2e 依赖）
        run: npm i -g @deepseek-ai/dsh@0.1.0-rc.6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        run: pnpm test
      - name: e2e Phase C（client-tell 注入/禁用端点/组合图排除）
        run: pnpm e2e:c
      - name: e2e Phase D（import 预检拦截）
        run: pnpm e2e:d
      - name: e2e Phase E+F+G（幂等性/YAML 损坏/多坏插件）
        run: pnpm e2e:efg
      - name: e2e S3（端点 maxDisable 熔断）
        run: pnpm e2e:s3c

  full:
    name: 全链路 e2e（A-H，手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装 dsh CLI（e2e 依赖）
        run: npm i -g @deepseek-ai/dsh@0.1.0-rc.6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 全链路 e2e
        run: node test/e2e/run-e2e.mjs
